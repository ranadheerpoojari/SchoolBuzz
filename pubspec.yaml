name: schoolbuzz
description: School drop-off & pickup assistant with geofencing and WhatsApp sharing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  sqflite: ^2.4.1
  path: ^1.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  uuid: ^4.5.1
  intl: ^0.19.0
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
