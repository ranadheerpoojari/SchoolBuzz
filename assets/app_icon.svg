<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1E40AF"/>
    </linearGradient>
    <linearGradient id="school" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E0E7FF"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- School building -->
  <path d="M256 100 L140 180 L140 340 L372 340 L372 180 Z" fill="url(#school)" opacity="0.95"/>
  <!-- Roof triangle -->
  <path d="M256 80 L120 180 L392 180 Z" fill="#FFFFFF"/>
  <!-- Door -->
  <rect x="226" y="260" width="60" height="80" rx="4" fill="#2563EB"/>
  <!-- Windows -->
  <rect x="170" y="200" width="44" height="44" rx="6" fill="#BFDBFE"/>
  <rect x="298" y="200" width="44" height="44" rx="6" fill="#BFDBFE"/>
  <!-- Clock/Bell circle -->
  <circle cx="256" cy="160" r="22" fill="#FCD34D"/>
  <text x="256" y="168" font-family="Arial" font-size="24" font-weight="bold" fill="#1E3A8A" text-anchor="middle">🔔</text>
  <!-- Buzz bee accent -->
  <circle cx="390" cy="120" r="28" fill="#FCD34D" opacity="0.95"/>
  <text x="390" y="132" font-family="Arial" font-size="30" text-anchor="middle">🐝</text>
  <!-- Ground -->
  <rect x="100" y="340" width="312" height="12" rx="6" fill="#10B981" opacity="0.8"/>
</svg>
